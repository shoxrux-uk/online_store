<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
</head>
<body>
    <a href="{% url 'category_detail' product.category.slug %}">← Назад к категории</a>
    
    <h1>{{ product.name }}</h1>
    
    {% if product.image %}
        <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-width: 400px;">
    {% endif %}
    
    <p><strong>Цена:</strong> {{ product.price }} usd.</p>
    <p><strong>Описание:</strong> {{ product.description }}</p>
    <p><strong>Категория:</strong> {{ product.category.name }}</p>
    <p><strong>В наличии:</strong> {% if product.in_stock %} Да ✅ {% else %} Нет ❌ {% endif %}</p>
</body>
</html>
