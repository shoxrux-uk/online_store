{% extends 'shop/base.html' %}

{% block title %}Главная{% endblock %}

{% block content %}
    <h1>Наши категории</h1>
    <ul>
        {% for category in categories %}
            <li>
                <a href="{% url 'category_detail' category.slug %}">
                    {{ category.name }}
                </a>
            </li>
        {% empty %}
            <li>Категорий пока нет</li>
        {% endfor %}
    </ul>
{% endblock %}
