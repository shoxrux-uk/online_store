<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Магазин{% endblock %}</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }
        header {
            background: #333;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: white;
            text-decoration: none;
            margin: 0 10px;
        }
        header a:hover {
            text-decoration: underline;
        }
        .cart-icon {
            background: #ff6600;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .container {
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }
    </style>
</head>
<body>
    <header>
        <div>
            <a href="{% url 'product_list' %}">🏠 Главная</a>
        </div>
        <div>
            <a href="{% url 'cart_view' %}" class="cart-icon">
                🛒 {{ cart_count }}
            </a>
        </div>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
